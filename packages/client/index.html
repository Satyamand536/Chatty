<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>CHAOS KITCHEN — Phase 2 greybox prototype</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #14161a; overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #e8e8e8; }
      canvas { display: block; }

      #hud {
        position: fixed; inset: 0; pointer-events: none; z-index: 10;
        padding: 10px 12px; font-size: 13px;
      }
      .row { display: flex; gap: 14px; align-items: baseline;
        text-shadow: 0 1px 3px #000; }
      .clock { font-size: 30px; font-weight: 700; letter-spacing: 1px; }
      .clock.urgent { color: #ff6b6b; animation: pulse 0.7s infinite; }
      @keyframes pulse { 50% { opacity: 0.45; } }
      .coins { font-size: 22px; color: #ffd166; font-weight: 700; }
      .combo { font-size: 16px; color: #7ee787; font-weight: 700; }

      .chaos { margin-top: 6px; max-width: 420px; }
      .chaosbar { height: 12px; background: rgba(0,0,0,.55); border: 1px solid #3a3f48;
        border-radius: 7px; overflow: hidden; }
      .chaosfill { height: 100%; width: 0%; background: #4a90d9; transition: width .15s linear; }
      .chaosfill.warm { background: #f2c14e; }
      .chaosfill.hot  { background: #ff3d3d; animation: pulse 0.5s infinite; }
      .chaoslabel { margin-top: 3px; font-size: 12px; color: #cfd3d8; text-shadow: 0 1px 3px #000; }
      .chaoslabel b { color: #ffd166; }

      .rail { position: fixed; top: 10px; right: 12px; width: 210px; display: flex;
        flex-direction: column; gap: 6px; }
      .ticket { background: #f4efe2; color: #222; border-radius: 5px; padding: 6px 8px;
        font-size: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.45); border-left: 4px solid #6fbf4a; }
      .ticket.late { border-left-color: #e8622c; }
      .ticket.empty { background: rgba(0,0,0,.45); color: #9aa0a6; border-left-color: #3a3f48; }
      .tname { font-weight: 700; }
      .tval { float: right; color: #6b6b6b; }
      .tbar { display: block; height: 5px; background: #d8d2c2; border-radius: 3px;
        margin-top: 5px; overflow: hidden; }
      .tbar i { display: block; height: 100%; background: #6fbf4a; }
      .ticket.late .tbar i { background: #e8622c; }

      .ctx { position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%);
        background: rgba(0,0,0,.68); border: 1px solid #3a3f48; border-radius: 8px;
        padding: 7px 14px; font-size: 14px; white-space: nowrap; }
      .ctx b { color: #ffd166; }
      .hint { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
        color: #9aa0a6; font-size: 12px; text-shadow: 0 1px 3px #000; }

      #bill { position: fixed; inset: 0; z-index: 20; display: none;
        background: rgba(10,11,14,.86); backdrop-filter: blur(3px);
        align-items: center; justify-content: center; }
      .card { background: #f4efe2; color: #1c1c1c; width: min(92vw, 380px);
        padding: 22px 24px; border-radius: 4px; box-shadow: 0 12px 40px rgba(0,0,0,.6);
        /* receipt edge */
        --n: 8px;
        -webkit-mask: radial-gradient(var(--n) at var(--n) 50%, #0000 98%, #000) 0 0/100% 22px;
      }
      .card h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: 3px; text-align: center; }
      .grade { font-size: 54px; font-weight: 800; text-align: center; line-height: 1; }
      .grade-S { color: #b8860b; } .grade-A { color: #2e7d32; }
      .grade-B { color: #1565c0; } .grade-C { color: #ef6c00; } .grade-D { color: #c62828; }
      .big { text-align: center; font-size: 26px; font-weight: 700; margin: 4px 0 12px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      td { padding: 3px 0; border-bottom: 1px dotted #bdb6a4; }
      td:last-child { text-align: right; font-weight: 700; }
      .verdict { margin-top: 14px; text-align: center; font-style: italic; font-size: 14px; }
      .seed { margin-top: 8px; text-align: center; font-size: 11px; color: #8a8f98; }
      .near { margin-top: 10px; text-align: center; font-size: 13px; color: #b8860b; }
      .card button { display: block; margin: 16px auto 0; font: inherit; font-weight: 700;
        padding: 10px 22px; border-radius: 6px; border: 2px solid #1c1c1c;
        background: #ffd166; color: #1c1c1c; cursor: pointer; }
      .card button:hover { background: #ffe08a; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="bill"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
